# Confere tipos, valida o conteúdo contra os esquemas e gera o site a cada push e pull request.
# Um rascunho mal preenchido ou um conteúdo "aprovado" sem revisor quebra este passo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
